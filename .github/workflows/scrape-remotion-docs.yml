name: Scrape Remotion Documentation

on:
  # Manual trigger from GitHub UI
  workflow_dispatch:

  # Optional: Run weekly on Sundays at midnight
  # schedule:
  #   - cron: '0 0 * * 0'

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4 html2text

      - name: Update scraper paths for CI
        run: |
          # Update paths to use relative paths for CI environment
          sed -i 's|/Users/apage/support-docs/||g' scrape_remotion_docs.py

      - name: Run scraper
        run: |
          python scrape_remotion_docs.py
        timeout-minutes: 30

      - name: Commit and push changes
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git add api/remotion/ scrape_remotion_docs.py

          # Check if there are changes to commit
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update Remotion documentation (automated scrape)

            Co-Authored-By: GitHub Actions <actions@github.com>"
            git push
          fi
